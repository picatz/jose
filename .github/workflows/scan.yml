name: Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  codeql:
    name: "CodeQL"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: go
      - uses: github/codeql-action/autobuild@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5

  govulncheck:
    name: "govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # go.mod sets the oldest Go a consumer may build with; scan the
          # current release, since a consumer's toolchain supplies the
          # standard library and old point releases always carry fixed CVEs.
          go-version: stable
          cache: false
      # The module has no dependencies, so this checks the Go standard
      # library this module calls into for known vulnerabilities.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
