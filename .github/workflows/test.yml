name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  go:
    name: "Go"
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit; the comment names the release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -short skips the tests that fetch public JWK Sets, so CI is hermetic.
      - run: go test -race -short ./...
      - name: Check that the core packages stay offline
        run: |
          if go list -deps ./pkg/base64 ./pkg/dpop ./pkg/header ./pkg/jwa ./pkg/jwe ./pkg/jwk ./pkg/jwk/thumbprint ./pkg/jws ./pkg/jwt ./pkg/jwtchain ./pkg/ni | grep -qx net/http; then
            echo "a core package imports net/http; HTTP helpers belong in the *http packages" >&2
            exit 1
          fi
